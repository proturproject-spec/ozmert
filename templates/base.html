<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Yönetim Paneli{% endblock %}</title>
    <script>
        // Sekme / Sayfa Kapanma Doğrulaması (Tab Session Handshake)
        (function() {
            const serverToken = "{{ session_tab_token }}";
            const isFresh = {{ 'true' if is_fresh_login else 'false' }};
            if (serverToken) {
                if (isFresh) {
                    sessionStorage.setItem('active_tab_token', serverToken);
                } else {
                    const storedToken = sessionStorage.getItem('active_tab_token');
                    if (!storedToken || storedToken !== serverToken) {
                        // Sekme veya sayfa 'X' ile kapatılmış, yeni sekmede/pencerede açılmış
                        sessionStorage.removeItem('active_tab_token');
                        window.location.replace('/logout?timeout=1');
                    }
                }
            }
        })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: #60a5fa;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 0.75rem;
        }

        nav a {
            text-decoration: none;
            color: var(--text-muted);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        nav a:hover {
            color: var(--text-main);
            background-color: var(--border-color);
        }

        nav a.active {
            color: #ffffff;
            background-color: var(--accent);
        }

        main {
            flex: 1;
            padding: 2.5rem 2rem;
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 2rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
        }

        p {
            color: var(--text-muted);
            line-height: 1.6;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .param-dropdown {
            position: relative;
            display: inline-block;
        }

        .param-btn {
            background-color: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .param-btn:hover, .param-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            border-color: var(--accent);
        }

        .param-menu {
            display: none;
            position: absolute;
            right: 0;
            top: calc(100% + 8px);
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            min-width: 220px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            z-index: 50;
            overflow: hidden;
        }

        .param-menu.show {
            display: block;
        }

        .param-menu a {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1rem;
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.875rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.15s ease;
        }

        .param-menu a:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: #60a5fa;
        }

        .param-menu .param-placeholder {
            padding: 0.75rem 1rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>
    <header>
        <div style="display: flex; align-items: center; gap: 2rem;">
            <a href="/" class="logo">⚡ Finans & Muhasebe Paneli</a>
            <nav>
                <ul>
                    <li><a href="/" class="{% if aktif_sayfa == 'index' %}active{% endif %}">Ana Sayfa</a></li>
                    <li><a href="/muhasebe" class="{% if aktif_sayfa == 'muhasebe' %}active{% endif %}">Muhasebe</a></li>
                    <li><a href="/finans" class="{% if aktif_sayfa == 'finans' %}active{% endif %}">Finans</a></li>
                    <li><a href="/raporlar" class="{% if aktif_sayfa == 'raporlar' %}active{% endif %}">Raporlar</a></li>
                    <li><a href="/parametreler" class="{% if aktif_sayfa == 'parametreler' %}active{% endif %}">Parametreler</a></li>
                </ul>
            </nav>
        </div>

        <div class="header-right">
            <!-- Sağ Üst Parametre Dropdown Menüsü -->
            <div class="param-dropdown" id="paramDropdown">
                <button type="button" class="param-btn {% if aktif_sayfa == 'parametreler' %}active{% endif %}" id="paramBtn" onclick="toggleParamDropdown(event)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                    </svg>
                    <span>Parametreler</span>
                    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 2px;">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="param-menu" id="paramMenu">
                    <a href="/parametreler#baglanti" onclick="selectParamTab('tab-baglanti')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                        </svg>
                        <span>🔌 SQL Bağlantı Ayarları</span>
                    </a>
                    <a href="/parametreler#genel" onclick="selectParamTab('tab-genel')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="3"></circle>
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                        </svg>
                        <span>⚙️ Genel Parametreler</span>
                    </a>
                    <a href="/parametreler#guvenlik" onclick="selectParamTab('tab-guvenlik')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        <span>🔒 Güvenlik & Yetkiler</span>
                    </a>
                </div>
            </div>

            {% if current_user %}
            <div style="display: flex; align-items: center; gap: 0.6rem; padding-left: 0.5rem; border-left: 1px solid var(--border-color);">
                <div style="display: flex; align-items: center; gap: 0.4rem; background: rgba(255,255,255,0.05); padding: 0.35rem 0.75rem; border-radius: 0.5rem; border: 1px solid rgba(255,255,255,0.08); font-size: 0.85rem;">
                    <span style="color: #60a5fa;">👤</span>
                    <span style="font-weight: 600; color: #f8fafc;">{{ current_user.name or current_user.username }}</span>
                </div>
                <a href="/logout" title="Çıkış Yap" style="display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.25); color: #f87171; border-radius: 0.5rem; text-decoration: none; transition: all 0.2s ease;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                </a>
            </div>
            {% endif %}
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <script>
        function toggleParamDropdown(e) {
            e.stopPropagation();
            const menu = document.getElementById('paramMenu');
            menu.classList.toggle('show');
        }

        window.addEventListener('click', function(e) {
            const menu = document.getElementById('paramMenu');
            if (menu && menu.classList.contains('show')) {
                if (!e.target.closest('#paramDropdown')) {
                    menu.classList.remove('show');
                }
            }
        });

        function selectParamTab(tabId) {
            if (window.location.pathname === '/parametreler') {
                if (typeof switchTabById === 'function') {
                    switchTabById(tabId);
                }
                const menu = document.getElementById('paramMenu');
                if (menu) menu.classList.remove('show');
            }
        }

        // --- 5 DAKİKA HAREKETSİZLİK & SAYFA GÜVENLİK ZAMANLAYICISI ---
        (function() {
            let inactivitySeconds = 0;
            const MAX_INACTIVITY_SECONDS = 300; // 5 Dakika (300 saniye)

            function resetInactivity() {
                inactivitySeconds = 0;
            }

            // Fare, klavye, tıklama, kaydırma ve dokunma hareketlerinde süreyi sıfırla
            window.addEventListener('mousemove', resetInactivity, { passive: true });
            window.addEventListener('keydown', resetInactivity, { passive: true });
            window.addEventListener('click', resetInactivity, { passive: true });
            window.addEventListener('scroll', resetInactivity, { passive: true });
            window.addEventListener('touchstart', resetInactivity, { passive: true });

            setInterval(() => {
                inactivitySeconds += 1;
                if (inactivitySeconds >= MAX_INACTIVITY_SECONDS) {
                    window.location.href = '/logout?timeout=1';
                }
            }, 1000);

            // Sekme değiştirilip 5 dakika sonra geri gelindiğinde kontrol et
            let lastActiveTime = Date.now();
            document.addEventListener('visibilitychange', () => {
                if (!document.hidden) {
                    const elapsed = (Date.now() - lastActiveTime) / 1000;
                    if (elapsed >= MAX_INACTIVITY_SECONDS) {
                        window.location.href = '/logout?timeout=1';
                    }
                }
                lastActiveTime = Date.now();
            });
        })();
    </script>
</body>
</html>
